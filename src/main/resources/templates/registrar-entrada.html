<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Registrar entrada | Estacionamento</title><link rel="stylesheet" href="/estacionamento.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">ESTACIONAMENTO</div><nav class="nav"><a class="" href="/painel">Dashboard</a><a class="active" href="/veiculos/registrar-entrada">Entrada</a><a class="" href="/veiculos/saida">Saída</a><a class="" href="/veiculos">Veículos</a><a class="" href="/relatorios">Relatórios</a></nav></aside><main class="content"><div class="page-title"><h1>Registrar entrada</h1><p>Cadastre o veículo que está entrando no estacionamento.</p></div><section class="panel form-panel"><div class="help">Vagas disponíveis: <strong th:text="${vagasDisponiveis}">50</strong></div><div class="alert" th:if="${param.lotado}">O estacionamento está lotado. Não é possível registrar outra entrada.</div><form method="post" action="/veiculos/cadastrar"><div class="form-grid"><div class="field"><label for="placa">Placa</label><input type="text" id="placa" name="placa" maxlength="7" placeholder="Ex.: ABC1D23" required></div><div class="field"><label for="modelo">Modelo</label><input type="text" id="modelo" name="modelo" placeholder="Ex.: Corolla" required></div><div class="field"><label for="cor">Cor</label><input type="text" id="cor" name="cor" placeholder="Ex.: Preto" required></div><div class="field"><label for="observacao">Observações</label><input type="text" id="observacao" name="observacao" placeholder="Opcional"></div></div><div class="form-actions"><button class="btn primary" type="submit">Salvar entrada</button><a class="btn secondary" href="/painel">Cancelar</a></div></form></section></main></div></body></html>
