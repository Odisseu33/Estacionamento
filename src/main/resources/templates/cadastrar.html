<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cadastro | Estacionamento</title><link rel="stylesheet" href="/estacionamento.css"></head><body class="auth-page"><main class="auth-card"><div class="auth-brand">ESTACIONAMENTO</div><h1 class="auth-title">Criar cadastro</h1><p class="auth-sub">Preencha seus dados para acessar o sistema.</p><div class="alert" th:if="${erro}" th:text="${erro}"></div><form method="post" action="/efetuar-cadastro"><div class="field"><label for="nome">Nome</label><input type="text" id="nome" name="nome" placeholder="Digite seu nome" required></div><div class="field"><label for="cpf">CPF</label><input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required></div><div class="field"><label for="telefone">Telefone</label><input type="text" id="telefone" name="telefone" placeholder="Digite seu telefone" required></div><div class="field"><label for="email">E-mail</label><input type="email" id="email" name="email" placeholder="Digite seu e-mail" required></div><div class="field"><label for="senha">Senha</label><input type="password" id="senha" name="senha" placeholder="Digite sua senha" required></div><div class="field"><label for="data_nascimento">Data de nascimento</label><input type="date" id="data_nascimento" name="data_nascimento" required></div><button class="btn primary" type="submit">Criar cadastro</button></form><a class="auth-link" href="/">Já possui uma conta? Voltar ao login</a></main></body></html>
