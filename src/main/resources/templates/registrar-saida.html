<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Registrar saída | Estacionamento</title><link rel="stylesheet" href="/estacionamento.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">ESTACIONAMENTO</div><nav class="nav"><a class="" href="/painel">Dashboard</a><a class="" href="/veiculos/registrar-entrada">Entrada</a><a class="active" href="/veiculos/saida">Saída</a><a class="" href="/veiculos">Veículos</a><a class="" href="/relatorios">Relatórios</a></nav></aside><main class="content"><div class="page-title"><h1>Registrar saída</h1><p>Selecione o veículo que está saindo do estacionamento.</p></div><section class="panel form-panel"><p class="help" th:if="${veiculos.isEmpty()}">Nenhum veículo estacionado no momento.</p><div th:if="${!veiculos.isEmpty()}"><div class="field"><label for="placa">Veículo</label><select id="placa" onchange="selecionarVeiculo(this.value)"><option value="">Selecione a placa</option><option th:each="v : ${veiculos}" th:value="${v.id}" th:text="${v.placa + ' — ' + v.modelo}" th:selected="${veiculo != null and veiculo.id == v.id}"></option></select></div></div><div class="panel" style="background:#fafafa;box-shadow:none;margin:5px 0 18px;padding:16px" th:if="${veiculo != null}"><div style="font-size:13px;line-height:1.8"><strong>Modelo:</strong> <span th:text="${veiculo.modelo}"></span><br><strong>Cor:</strong> <span th:text="${veiculo.cor}"></span><br><strong>Entrada:</strong> <span th:text="${veiculo.horaEntrada != null ? #temporals.format(veiculo.horaEntrada,'dd/MM/yyyy HH:mm') : '-'}"></span></div></div><form th:if="${veiculo != null}" method="post" th:action="@{/veiculos/saida/{id}(id=${veiculo.id})}"><div class="form-actions"><button class="btn primary" type="submit">Confirmar saída</button><a class="btn secondary" href="/veiculos/saida">Limpar</a></div></form></section></main></div><script>function selecionarVeiculo(id){window.location.href=id?"/veiculos/saida/"+id:"/veiculos/saida";}</script></body></html>
